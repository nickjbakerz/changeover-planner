name: Build release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            artifact: macOS-Apple-Silicon
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            artifact: macOS-Intel
          - runner: windows-latest
            platform: win32
            arch: x64
            artifact: Windows-x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            artifact: Linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Install WiX Toolset
        if: matrix.platform == 'win32'
        shell: powershell
        run: choco install wixtoolset --version=3.14.0 -y --no-progress
      - run: pnpm exec electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Changeover-Planner-${{ matrix.artifact }}
          path: out/make/**/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp "$(find release-files -type f -name '*-arm64.dmg' -print -quit)" release-files/Changeover-Planner-Mac-Apple-Silicon.dmg
          cp "$(find release-files -type f -name '*-x64.dmg' -print -quit)" release-files/Changeover-Planner-Mac-Intel.dmg
          cp "$(find release-files -type f -name '*.msi' -print -quit)" release-files/Changeover-Planner-Windows-Installer.msi
          cp "$(find release-files -type f -name '*win32-x64*.zip' -print -quit)" release-files/Changeover-Planner-Windows-Portable.zip
          cp "$(find release-files -type f -name '*linux-x64*.zip' -print -quit)" release-files/Changeover-Planner-Linux-x64.zip
          mapfile -d '' files < <(find release-files -type f -print0)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --title "Changeover Planner ${GITHUB_REF_NAME}" --generate-notes --latest
